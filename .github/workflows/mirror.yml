name: mirror

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

env:
  GITLAB_REPO: git@gitlab.com:m0rthis/gansible.git

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check for mirror key
        id: key
        env:
          GITLAB_MIRROR_KEY: ${{ secrets.GITLAB_MIRROR_KEY }}
        run: |
          if [ -z "$GITLAB_MIRROR_KEY" ]; then
            echo "::notice title=GitLab mirror skipped::GITLAB_MIRROR_KEY secret is not set"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push all branches and tags to GitLab
        if: steps.key.outputs.present == 'true'
        env:
          GITLAB_MIRROR_KEY: ${{ secrets.GITLAB_MIRROR_KEY }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITLAB_MIRROR_KEY" > "$HOME/.ssh/gitlab_mirror"
          chmod 600 "$HOME/.ssh/gitlab_mirror"
          # gitlab.com ED25519 host key, SHA256:eUXGGm1YGsMAS7vkcx6JOJdOGHPem5gQp4taiCfCLB8
          printf '%s\n' 'gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf' \
            > "$HOME/.ssh/gitlab_known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/gitlab_mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/gitlab_known_hosts"

          git remote add gitlab "$GITLAB_REPO"
          # Branches exist locally only as origin remote-tracking refs after a
          # full checkout, so map those onto GitLab's heads. Drop origin/HEAD
          # first (git push ignores negative refspecs) so no "HEAD" branch
          # gets created on GitLab.
          git remote set-head origin --delete
          git push --force --prune gitlab \
            'refs/remotes/origin/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'

      - name: Remove key
        if: always() && steps.key.outputs.present == 'true'
        run: rm -f "$HOME/.ssh/gitlab_mirror"
